name: CI - Worker (ECR push + Update platform-apps tag)

on:
  push:
    branches: ["main"]
    paths:
      - "worker/**"
      - ".github/workflows/call-docker-build-worker.yaml"
  pull_request:
    branches: ["main"]
    paths:
      - "worker/**"
      - ".github/workflows/call-docker-build-worker.yaml"

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_ACCOUNT_ID: "311141549490"
  ECR_REPO_NAME: bion-talent-311141549490-worker-app

  PLATFORM_APPS_REPO: aybukekraca/platform-apps
  PLATFORM_APPS_REF: main
  PLATFORM_APPS_PATH: platform-apps
  VALUES_FILE: helm/values/worker-app/values.yaml

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}
    steps:
      - uses: actions/checkout@v4

      - name: Meta (tag)
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="sha-${SHORT_SHA}-${GITHUB_RUN_NUMBER}"
          IMAGE_URI="${ECR_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO_NAME}:${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (push only)
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::130575395405:role/talent_role
          role-session-name: aybuke-bion
          role-skip-session-tagging: true

      - name: Login to Amazon ECR (push only)
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify ECR repository exists (push only)
        if: github.event_name == 'push'
        run: |
          aws ecr describe-repositories \
            --registry-id "${ECR_ACCOUNT_ID}" \
            --repository-names "${ECR_REPO_NAME}" >/dev/null

      - name: Build (PR)
        if: github.event_name == 'pull_request'
        run: |
          docker build -t "worker-app:test" -f worker/Dockerfile worker

      - name: Build + Push (main) - clean
        if: github.event_name == 'push'
        env:
          IMAGE_URI: ${{ steps.meta.outputs.image_uri }}
        run: |
          docker build -t "${IMAGE_URI}" -f worker/Dockerfile worker
          docker push "${IMAGE_URI}"

  update_platform_apps:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [build_and_push]
    permissions:
      contents: write
    steps:
      - name: Checkout platform-apps
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PLATFORM_APPS_REPO }}
          token: ${{ secrets.PLATFORM_APPS_TOKEN }}
          ref: ${{ env.PLATFORM_APPS_REF }}
          path: ${{ env.PLATFORM_APPS_PATH }}

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Update image tag in values.yaml
        env:
          TAG: ${{ needs.build_and_push.outputs.tag }}
        run: |
          cd "${PLATFORM_APPS_PATH}"
          yq -i '.deployment.image.tag = strenv(TAG)' "${VALUES_FILE}"
          git diff

      - name: Commit & push
        env:
          TAG: ${{ needs.build_and_push.outputs.tag }}
        run: |
          cd "${PLATFORM_APPS_PATH}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add "${VALUES_FILE}"
          git commit -m "chore(worker): bump image tag to ${TAG}" || exit 0
          git push
