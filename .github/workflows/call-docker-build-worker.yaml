name: CI - Worker (ECR push + Update platform-apps tag only)

on:
  push:
    branches: ["main"]
    paths:
      - "worker/**"
      - ".github/workflows/call-docker-build-worker.yaml"
  pull_request:
    branches: ["main"]
    paths:
      - "worker/**"
      - ".github/workflows/call-docker-build-worker.yaml"

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_ACCOUNT_ID: ${{ secrets.ECR_ACCOUNT_ID }}
  ECR_REPO_NAME: "bion-talent-311141549490-worker-app"  
  PLATFORM_APPS_REPO: "aybukekraca/platform-apps"
  PLATFORM_APPS_REF: "main"
  PLATFORM_APPS_PATH: "platform-apps"
  VALUES_FILE: "worker-app/values.yaml"

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (push only)
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::130575395405:role/talent_role
          role-session-name: aybuke-bion
          role-skip-session-tagging: true
          
      - name: Meta
        id: meta
        run: |
          echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR (push only)
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify ECR repository exists (push only)
        if: github.event_name == 'push'
        run: |
          aws ecr describe-repositories --registry-id "${ECR_ACCOUNT_ID}" --repository-names "${ECR_REPO_NAME}" >/dev/null

      - name: Build (PR) / Build+Push (main)
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            docker build -t "worker-app:${TAG}" -f worker/Dockerfile worker
            exit 0
          fi

          IMAGE_URI="${ECR_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO_NAME}:${TAG}"
          docker buildx build --platform linux/amd64 -t "${IMAGE_URI}" -f worker/Dockerfile worker --push

  update_platform_apps:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [build_and_push]
    permissions:
      contents: write
    steps:
      - name: Checkout platform-apps
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PLATFORM_APPS_REPO }}
          token: ${{ secrets.PLATFORM_APPS_TOKEN }}
          ref: ${{ env.PLATFORM_APPS_REF }}
          path: ${{ env.PLATFORM_APPS_PATH }}

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Update tag only (worker)
        env:
          TAG: ${{ needs.build_and_push.outputs.tag }}
        run: |
          cd "${PLATFORM_APPS_PATH}"
          yq -i ".worker.image.tag = \"${TAG}\"" "${VALUES_FILE}"
          git diff

      - name: Commit & push
        env:
          TAG: ${{ needs.build_and_push.outputs.tag }}
        run: |
          cd "${PLATFORM_APPS_PATH}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add "${VALUES_FILE}"
          git commit -m "chore(worker): bump tag to ${TAG}" || exit 0
          git push
