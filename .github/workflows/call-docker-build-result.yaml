name: CI - Result (ECR push + Update platform-apps tag only)

on:
  push:
    branches: ["main"]
    paths:
      - "result/**"
      - ".github/workflows/call-docker-build-result.yaml"
  pull_request:
    branches: ["main"]
    paths:
      - "result/**"
      - ".github/workflows/call-docker-build-result.yaml"

permissions:
  contents: read

env:
  PLATFORM_APPS_REPO: "aybukekraca/platform-apps"
  PLATFORM_APPS_REF: "main"
  PLATFORM_APPS_PATH: "platform-apps"
  VALUES_FILE: "result-app/values.yaml"
  SERVICE: "result"

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      region: ${{ steps.meta.outputs.region }}
      account_id: ${{ steps.meta.outputs.account_id }}
      repo_name: ${{ steps.meta.outputs.repo_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (push only)
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Meta
        id: meta
        run: |
          echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "region=${{ secrets.AWS_REGION }}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ]; then
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
            echo "repo_name=bion-talent-${ACCOUNT_ID}-${SERVICE}" >> "$GITHUB_OUTPUT"
          else
            echo "account_id=UNKNOWN" >> "$GITHUB_OUTPUT"
            echo "repo_name=bion-talent-PR-dummy-${SERVICE}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR (push only)
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify ECR repository exists (push only)
        if: github.event_name == 'push'
        run: |
          aws ecr describe-repositories --repository-names "${{ steps.meta.outputs.repo_name }}" >/dev/null

      - name: Build (PR) / Build+Push (main)
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          REGION: ${{ steps.meta.outputs.region }}
          ACCOUNT_ID: ${{ steps.meta.outputs.account_id }}
          REPO_NAME: ${{ steps.meta.outputs.repo_name }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            docker build -t "${SERVICE}:${TAG}" -f result/Dockerfile result
            exit 0
          fi

          IMAGE_URI="${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com/${REPO_NAME}:${TAG}"
          docker buildx build --platform linux/amd64 -t "${IMAGE_URI}" -f result/Dockerfile result --push

  update_platform_apps:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [build_and_push]
    steps:
      - name: Checkout platform-apps
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PLATFORM_APPS_REPO }}
          token: ${{ secrets.PLATFORM_APPS_TOKEN }}
          ref: ${{ env.PLATFORM_APPS_REF }}
          path: ${{ env.PLATFORM_APPS_PATH }}

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Update tag only (result)
        env:
          TAG: ${{ needs.build_and_push.outputs.tag }}
        run: |
          cd "${PLATFORM_APPS_PATH}"
          yq -i ".result.image.tag = \"${TAG}\"" "${VALUES_FILE}"
          git diff

      - name: Commit & push
        env:
          TAG: ${{ needs.build_and_push.outputs.tag }}
        run: |
          cd "${PLATFORM_APPS_PATH}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add "${VALUES_FILE}"
          git commit -m "chore(result): bump tag to ${TAG}" || exit 0
          git push
